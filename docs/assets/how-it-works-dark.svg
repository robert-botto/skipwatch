<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="title desc">
  <title id="title">How SkipWatch works</title>
  <desc id="desc">A link goes through ingest, transcribe and frames, frame-reader agents read the frames, Claude drafts the skill, skill-critic reviews it, check runs provenance, redaction and safety checks, you review it, and it is installed.</desc>
  <style>
    .bg { fill: #161b22; stroke: #30363d; }
    .node { fill: #0d1117; stroke: #3d444d; }
    .claude { fill: #24170f; stroke: #e08a68; }
    .name { fill: #e6edf3; }
    .desc { fill: #9198a1; }
    .accent { fill: #e08a68; }
    .wire { stroke: #656c76; fill: none; }
    .head { fill: #656c76; }
  </style>
  <rect class="bg" x="1" y="1" width="1198" height="448" rx="20" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect class="node" x="45" y="60" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="140" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">your link</text>
  <text class="desc" x="140" y="128" font-size="14.5" text-anchor="middle">a video URL</text>
  <text class="desc" x="140" y="147" font-size="14.5" text-anchor="middle">or a local file</text>
  <rect class="node" x="275" y="60" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="370" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">ingest</text>
  <text class="desc" x="370" y="128" font-size="14.5" text-anchor="middle">video, captions,</text>
  <text class="desc" x="370" y="147" font-size="14.5" text-anchor="middle">post text and links</text>
  <rect class="node" x="505" y="60" width="190" height="50" rx="12" stroke-width="1.5"/>
  <text class="name" x="600" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">transcribe</text>
  <rect class="node" x="505" y="120" width="190" height="50" rx="12" stroke-width="1.5"/>
  <text class="name" x="600" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">frames</text>
  <rect class="claude" x="735" y="60" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="830" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">read</text>
  <text class="desc" x="830" y="128" font-size="14.5" text-anchor="middle">frame-reader agents</text>
  <text class="desc" x="830" y="147" font-size="14.5" text-anchor="middle">write frame notes</text>
  <rect class="claude" x="965" y="60" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="1060" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">distill</text>
  <text class="desc" x="1060" y="128" font-size="14.5" text-anchor="middle">outline, then draft;</text>
  <text class="desc" x="1060" y="147" font-size="14.5" text-anchor="middle">every step tagged</text>
  <rect class="claude" x="45" y="250" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="140" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">critique</text>
  <text class="desc" x="140" y="318" font-size="14.5" text-anchor="middle">skill-critic</text>
  <text class="desc" x="140" y="337" font-size="14.5" text-anchor="middle">scores the draft</text>
  <rect class="node" x="275" y="250" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="370" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">check</text>
  <text class="desc" x="370" y="318" font-size="14.5" text-anchor="middle">provenance, redaction,</text>
  <text class="desc" x="370" y="337" font-size="14.5" text-anchor="middle">safety, style, structure</text>
  <rect class="claude" x="505" y="250" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="600" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">review</text>
  <text class="desc" x="600" y="318" font-size="14.5" text-anchor="middle">the review screen;</text>
  <text class="desc" x="600" y="337" font-size="14.5" text-anchor="middle">you say yes</text>
  <rect class="node" x="735" y="250" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="830" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">install</text>
  <text class="desc" x="830" y="318" font-size="14.5" text-anchor="middle">~/.claude/skills,</text>
  <text class="desc" x="830" y="337" font-size="14.5" text-anchor="middle">project or agents</text>
  <rect class="node" x="965" y="250" width="190" height="110" rx="12" stroke-width="1.5"/>
  <text class="name" x="1060" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">your skill</text>
  <text class="desc" x="1060" y="318" font-size="14.5" text-anchor="middle">every step traced</text>
  <text class="desc" x="1060" y="337" font-size="14.5" text-anchor="middle">to the video</text>
  <path class="wire" d="M235 115 H267" stroke-width="2"/>
  <path class="head" d="M266 110 L275 115 L266 120 Z"/>
  <path class="wire" d="M465 115 H485.0 V85 H497 M485.0 115 V145 H497" stroke-width="2"/>
  <path class="head" d="M496 80 L505 85 L496 90 Z"/>
  <path class="head" d="M496 140 L505 145 L496 150 Z"/>
  <path class="wire" d="M695 85 H715.0 V145 H695 M715.0 115 H727" stroke-width="2"/>
  <path class="head" d="M726 110 L735 115 L726 120 Z"/>
  <path class="wire" d="M925 115 H957" stroke-width="2"/>
  <path class="head" d="M956 110 L965 115 L956 120 Z"/>
  <path class="wire" d="M1060.0 170 V210.0 H140.0 V242" stroke-width="2" stroke-linejoin="round"/>
  <path class="head" d="M135.0 241 L140.0 250 L145.0 241 Z"/>
  <path class="wire" d="M235 305 H267" stroke-width="2"/>
  <path class="head" d="M266 300 L275 305 L266 310 Z"/>
  <path class="wire" d="M465 305 H497" stroke-width="2"/>
  <path class="head" d="M496 300 L505 305 L496 310 Z"/>
  <path class="wire" d="M695 305 H727" stroke-width="2"/>
  <path class="head" d="M726 300 L735 305 L726 310 Z"/>
  <path class="wire" d="M925 305 H957" stroke-width="2"/>
  <path class="head" d="M956 300 L965 305 L956 310 Z"/>
  <rect class="node" x="45" y="406" width="28" height="18" rx="5" stroke-width="1.5"/>
  <text class="desc" x="83" y="420" font-size="15">the skipwatch engine: deterministic commands</text>
  <rect class="claude" x="625" y="406" width="28" height="18" rx="5" stroke-width="1.5"/>
  <text class="desc" x="663" y="420" font-size="15">Claude and its agents, in your session</text>
  </g>
</svg>
