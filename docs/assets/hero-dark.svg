<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="title desc">
  <title id="title">SkipWatch</title>
  <desc id="desc">A video link goes into /skipwatch and comes out as an installed skill folder.</desc>
  <style>
    .panel { fill: #161b22; stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .accent { fill: #e08a68; }
    .accent-stroke { stroke: #e08a68; }
    .card { fill: #0d1117; stroke: #30363d; }
    .screen { fill: #010409; }
    .play { fill: #ffffff; }
    .track { fill: #3d444d; }
    .chip { fill: #2b1d17; stroke: #6b3a26; }
    .line { stroke: #30363d; }
  </style>
  <rect class="panel" x="1" y="1" width="1198" height="458" rx="24" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="112" font-size="76" font-weight="700" letter-spacing="-1.5"><tspan class="fg">Skip</tspan><tspan class="accent">Watch</tspan></text>
    <text class="muted" x="600" y="162" font-size="28">Paste a video. Claude knows kung fu.</text>
  </g>

  <!-- the video link -->
  <g transform="translate(110 214)">
    <rect class="card" x="0" y="0" width="380" height="196" rx="16" stroke-width="2"/>
    <rect class="screen" x="16" y="16" width="348" height="124" rx="10"/>
    <circle class="accent" cx="190" cy="78" r="30"/>
    <path class="play" d="M180 62 L180 94 L206 78 Z"/>
    <rect class="track" x="32" y="122" width="316" height="5" rx="2.5"/>
    <rect class="accent" x="32" y="122" width="118" height="5" rx="2.5"/>
    <text class="fg" x="190" y="174" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x.com/creator/status/123</text>
  </g>

  <!-- the arrow -->
  <g>
    <text class="accent" x="600" y="296" font-size="22" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/skipwatch</text>
    <line class="accent-stroke" x1="518" y1="318" x2="668" y2="318" stroke-width="4" stroke-linecap="round"/>
    <path class="accent" d="M664 306 L686 318 L664 330 Z"/>
  </g>

  <!-- the installed skill -->
  <g transform="translate(710 214)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect class="card" x="0" y="0" width="380" height="196" rx="16" stroke-width="2"/>
    <path class="accent" d="M22 18 h22 l6 7 h30 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-58 a4 4 0 0 1 -4 -4 v-27 a4 4 0 0 1 4 -4 Z"/>
    <text class="fg" x="98" y="44" font-weight="700">your-skill/</text>
    <line class="line" x1="30" y1="64" x2="30" y2="176" stroke-width="2"/>
    <text class="fg" x="46" y="86">SKILL.md</text>
    <rect class="chip" x="146" y="70" width="190" height="24" rx="12" stroke-width="1.5"/>
    <text class="accent" x="241" y="87" font-size="14" text-anchor="middle">[on-screen 00:33]</text>
    <text class="fg" x="46" y="116">skipwatch.json</text>
    <text class="fg" x="46" y="146">references/</text>
    <text class="fg" x="46" y="176">assets/frames/</text>
  </g>
</svg>
